<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>兒童數學小達人 - 經典最初版</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 引入 Google Fonts 圓體 -->
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 16px;
        }
        .fun-font {
            font-family: 'ZCOOL KuaiLe', cursive;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center">

    <!-- 主容器 -->
    <div class="bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl p-6 md:p-8 max-w-md w-full text-center border-4 border-yellow-300">
        
        <!-- 頂部資訊：目前分數與獲得星星數 -->
        <div class="flex justify-around items-center mb-4 bg-yellow-50 p-3 rounded-2xl border-2 border-yellow-200">
            <div>
                <span class="text-xs text-gray-500 block">目前得分</span>
                <span id="currentScore" class="text-xl font-bold text-green-500">0 分</span>
            </div>
            <div>
                <span class="text-xs text-gray-500 block">獲得星星</span>
                <span id="starCount" class="text-xl font-bold text-yellow-500">⭐ 0</span>
            </div>
        </div>

        <!-- 標題 -->
        <h1 class="fun-font text-3xl md:text-4xl text-purple-600 mb-2 drop-shadow">🌟 數學小達人 🌟</h1>
        <p class="text-gray-600 text-sm mb-6">動動腦，算一算！</p>

        <!-- 模式選擇 -->
        <div class="flex justify-center gap-2 mb-6">
            <button onclick="setMode('add')" id="btn-add" class="px-4 py-2 rounded-xl font-bold text-sm bg-purple-600 text-white shadow transition transform active:scale-95">加法</button>
            <button onclick="setMode('sub')" id="btn-sub" class="px-4 py-2 rounded-xl font-bold text-sm bg-gray-200 text-gray-700 shadow transition transform active:scale-95">減法</button>
            <button onclick="setMode('mul')" id="btn-mul" class="px-4 py-2 rounded-xl font-bold text-sm bg-gray-200 text-gray-700 shadow transition transform active:scale-95">乘法</button>
        </div>

        <!-- 題目與視覺輔助區 -->
        <div class="bg-purple-50 rounded-2xl p-6 mb-6 border-2 border-purple-100">
            <!-- 題目文字 -->
            <div id="question" class="fun-font text-5xl md:text-6xl text-purple-700 mb-4 tracking-wider">
                3 + 5 = ?
            </div>

            <!-- 視覺輔助星星（可點擊數數） -->
            <div class="text-xs text-purple-400 mb-2">點擊星星來幫忙數數：</div>
            <div id="visualStars" class="flex flex-wrap justify-center gap-2 max-h-24 overflow-y-auto p-2">
                <!-- 動態生成星星 -->
            </div>
        </div>

        <!-- 答案輸入區 -->
        <div class="flex gap-2 mb-4">
            <input type="number" id="userAnswer" placeholder="輸入答案" class="w-full text-center text-2xl font-bold py-3 rounded-2xl border-2 border-purple-300 focus:outline-none focus:border-purple-500 bg-white shadow-inner">
            <button onclick="checkAnswer()" class="bg-green-500 hover:bg-green-600 text-white font-bold px-6 rounded-2xl shadow-lg transition transform active:scale-95 text-lg">確定</button>
        </div>

        <!-- 回饋訊息 -->
        <div id="feedback" class="h-8 font-bold text-lg mb-2 text-purple-600"></div>

    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        let currentMode = 'add'; // 'add', 'sub', 'mul'
        let num1 = 0, num2 = 0, correctAnswer = 0;
        let score = 0;
        let stars = 0;

        // 頁面載入時初始化第一道題目
        window.onload = function() {
            generateQuestion();
        };

        // 切換模式
        function setMode(mode) {
            currentMode = mode;
            ['add', 'sub', 'mul'].forEach(m => {
                const btn = document.getElementById(`btn-${m}`);
                if (m === mode) {
                    btn.className = "px-4 py-2 rounded-xl font-bold text-sm bg-purple-600 text-white shadow transition transform active:scale-95";
                } else {
                    btn.className = "px-4 py-2 rounded-xl font-bold text-sm bg-gray-200 text-gray-700 shadow transition transform active:scale-95";
                }
            });
            generateQuestion();
        }

        // 產生題目
        function generateQuestion() {
            document.getElementById('userAnswer').value = '';
            document.getElementById('feedback').innerText = '';

            if (currentMode === 'add') {
                num1 = Math.floor(Math.random() * 10) + 1;
                num2 = Math.floor(Math.random() * 10) + 1;
                correctAnswer = num1 + num2;
                document.getElementById('question').innerText = `${num1} + ${num2} = ?`;
            } else if (currentMode === 'sub') {
                num1 = Math.floor(Math.random() * 10) + 1;
                num2 = Math.floor(Math.random() * 10) + 1;
                if (num1 < num2) [num1, num2] = [num2, num1]; // 確保不出現負數
                correctAnswer = num1 - num2;
                document.getElementById('question').innerText = `${num1} - ${num2} = ?`;
            } else if (currentMode === 'mul') {
                num1 = Math.floor(Math.random() * 5) + 1; // 6歲適合 1-5 乘法
                num2 = Math.floor(Math.random() * 5) + 1;
                correctAnswer = num1 * num2;
                document.getElementById('question').innerText = `${num1} × ${num2} = ?`;
            }

            renderVisualStars(num1 + num2);
        }

        // 渲染視覺星星
        function renderVisualStars(count) {
            const container = document.getElementById('visualStars');
            container.innerHTML = '';
            const totalStars = Math.min(count, 20);
            for (let i = 0; i < totalStars; i++) {
                const star = document.createElement('span');
                star.innerText = '⭐';
                star.className = 'text-xl cursor-pointer transition transform hover:scale-125';
                star.onclick = function() {
                    this.style.opacity = this.style.opacity === '0.3' ? '1' : '0.3';
                };
                container.appendChild(star);
            }
        }

        // 檢查答案
        function checkAnswer() {
            const userInputValue = document.getElementById('userAnswer').value;
            if (userInputValue === '') return;

            const userAnswer = parseInt(userInputValue);
            const feedback = document.getElementById('feedback');

            let isCorrect = (userAnswer === correctAnswer);

            if (isCorrect) {
                score += 10;
                stars += 1;
                feedback.innerHTML = "🎉 太棒了！答對了！";
                feedback.className = "h-8 font-bold text-lg mb-2 text-green-600 animate-bounce";
            } else {
                feedback.innerHTML = `💪 沒關係，正確答案是 ${correctAnswer}`;
                feedback.className = "h-8 font-bold text-lg mb-2 text-orange-500";
            }

            // 更新畫面分數
            document.getElementById('currentScore').innerText = score + ' 分';
            document.getElementById('starCount').innerText = '⭐ ' + stars;

            // 1.5秒後自動下一題
            setTimeout(generateQuestion, 1500);
        }
    </script>
</body>
</html>
