<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>兒童數學小達人 - iPhone 14 Pro 20秒計時版</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 引入 Google Fonts 圓體 -->
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: #1e1e24;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .fun-font {
            font-family: 'ZCOOL KuaiLe', cursive;
        }
        /* iPhone 14 Pro 外框模擬 */
        .iphone-14-pro {
            width: 393px;
            height: 852px;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            border-radius: 48px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 12px #2d2d35;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        /* Dynamic Island 模擬 */
        .dynamic-island {
            width: 120px;
            height: 35px;
            background-color: black;
            border-radius: 20px;
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
        }
    </style>
</head>
<body>

    <!-- iPhone 14 Pro 機身容器 -->
    <div class="iphone-14-pro p-6 pt-14 text-center select-none">
        
        <!-- 動態島頂部條 -->
        <div class="dynamic-island"></div>

        <!-- 可滾動的主內容區 -->
        <div class="flex-1 flex flex-col justify-between overflow-y-auto no-scrollbar">
            
            <!-- 頂部資訊列：分數與紀錄 -->
            <div class="bg-white/80 backdrop-blur-md p-3 rounded-2xl shadow-sm border border-white/50 mb-3">
                <div class="flex justify-between items-center text-xs">
                    <div>
                        <span class="text-gray-500 block">最高紀錄</span>
                        <span id="highScore" class="text-base font-bold text-orange-500">0 分</span>
                    </div>
                    <div>
                        <span class="text-gray-500 block">目前得分</span>
                        <span id="currentScore" class="text-base font-bold text-green-600">0 分</span>
                    </div>
                    <div>
                        <span class="text-gray-500 block">獲得星星</span>
                        <span id="starCount" class="text-base font-bold text-yellow-500">⭐ 0</span>
                    </div>
                </div>
            </div>

            <!-- 標題與模式 -->
            <div>
                <h1 class="fun-font text-3xl text-purple-700 drop-shadow-sm mb-1">🌟 數學小達人 🌟</h1>
                <p class="text-gray-700 text-xs mb-3">20秒限時挑戰模式</p>
            </div>

            <!-- 模式選擇按鈕 -->
            <div class="flex justify-center gap-2 mb-3">
                <button onclick="setMode('add')" id="btn-add" class="flex-1 py-2 rounded-xl font-bold text-xs bg-purple-600 text-white shadow transition active:scale-95">加法</button>
                <button onclick="setMode('sub')" id="btn-sub" class="flex-1 py-2 rounded-xl font-bold text-xs bg-white/70 text-gray-700 shadow transition active:scale-95">減法</button>
                <button onclick="setMode('mul')" id="btn-mul" class="flex-1 py-2 rounded-xl font-bold text-xs bg-white/70 text-gray-700 shadow transition active:scale-95">乘法</button>
            </div>

            <!-- 題目卡片、計時器與視覺輔助 -->
            <div class="bg-white/90 backdrop-blur-md rounded-2xl p-4 mb-3 shadow-md border border-white/60">
                
                <!-- 20秒倒數進度條區塊 -->
                <div class="mb-3">
                    <div class="flex justify-between text-xs font-bold text-gray-600 mb-1">
                        <span>⏳ 剩餘時間</span>
                        <span id="timerText" class="text-purple-600">20 秒</span>
                    </div>
                    <div class="w-full bg-gray-200 h-3 rounded-full overflow-hidden border border-gray-300">
                        <div id="timerBar" class="bg-gradient-to-r from-green-400 to-emerald-500 h-full w-full transition-all duration-1000 linear"></div>
                    </div>
                </div>

                <!-- 題目顯示 -->
                <div id="question" class="fun-font text-5xl text-purple-700 mb-2 tracking-wider">
                    3 + 5 = ?
                </div>
                <div class="text-[11px] text-purple-400 mb-1">點擊星星輔助數數：</div>
                <div id="visualStars" class="flex flex-wrap justify-center gap-1.5 max-h-20 overflow-y-auto p-1">
                    <!-- 動態產生星星 -->
                </div>
            </div>

            <!-- 答案輸入與提交 -->
            <div class="flex gap-2 mb-2">
                <input type="number" id="userAnswer" placeholder="輸入答案" class="w-full text-center text-xl font-bold py-2.5 rounded-xl border-2 border-purple-300 focus:outline-none bg-white shadow-inner">
                <button onclick="checkAnswer()" class="bg-green-500 hover:bg-green-600 text-white font-bold px-5 rounded-xl shadow-md transition active:scale-95 text-base">確定</button>
            </div>

            <!-- 回饋提示 -->
            <div id="feedback" class="h-6 font-bold text-sm mb-2 text-purple-700"></div>

            <!-- 底部歷史紀錄區塊 -->
            <div class="border-t border-black/10 pt-2">
                <div class="flex justify-between text-xs text-gray-700">
                    <button onclick="toggleHistory()" class="hover:text-purple-700 underline font-medium">📜 查看歷史紀錄</button>
                    <button onclick="resetData()" class="hover:text-red-600 underline font-medium">🗑️ 清除紀錄</button>
                </div>
                
                <div id="historyPanel" class="hidden mt-2 bg-white/80 rounded-xl p-3 text-left border border-white/50 max-h-28 overflow-y-auto text-xs">
                    <h3 class="font-bold text-gray-700 mb-1">最近練習：</h3>
                    <ul id="historyList" class="space-y-1 text-gray-600">
                        <li class="text-gray-400">尚無紀錄</li>
                    </ul>
                </div>
            </div>

        </div>
    </div>

    <!-- JavaScript 邏輯區段 -->
    <script>
        // 設定與全域變數
        let currentMode = 'add';
        let num1 = 0, num2 = 0, correctAnswer = 0;
        let score = 0, stars = 0, highScore = 0;
        let historyLogs = [];

        // 【修改重點】計時器變數：修改為 20 秒
        const TOTAL_TIME = 20; 
        let timeLeft = TOTAL_TIME;
        let timerInterval = null;

        // 頁面載入初始化
        window.onload = function() {
            const savedHighScore = localStorage.getItem('math_highScore');
            if (savedHighScore !== null) {
                highScore = parseInt(savedHighScore);
                document.getElementById('highScore').innerText = highScore + ' 分';
            }

            const savedHistory = localStorage.getItem('math_history');
            if (savedHistory !== null) {
                historyLogs = JSON.parse(savedHistory);
                updateHistoryUI();
            }

            generateQuestion();
        };

        // 啟動倒數計時器
        function startTimer() {
            clearInterval(timerInterval); // 清除舊的計時器
            timeLeft = TOTAL_TIME;
            updateTimerUI();

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeOut(); // 時間到的處理
                }
            }, 1000);
        }

        // 更新計時器視覺 UI
        function updateTimerUI() {
            const timerText = document.getElementById('timerText');
            const timerBar = document.getElementById('timerBar');
            
            timerText.innerText = `${timeLeft} 秒`;
            const percentage = (timeLeft / TOTAL_TIME) * 100;
            timerBar.style.width = `${percentage}%`;

            // 當時間少於 5 秒時變為警告紅色
            if (timeLeft <= 5) {
                timerBar.className = "bg-gradient-to-r from-red-500 to-rose-600 h-full transition-all duration-1000 linear";
                timerText.className = "text-red-600 animate-pulse font-bold";
            } else {
                timerBar.className = "bg-gradient-to-r from-green-400 to-emerald-500 h-full transition-all duration-1000 linear";
                timerText.className = "text-purple-600";
            }
        }

        // 超時自動結算
        function handleTimeOut() {
            const feedback = document.getElementById('feedback');
            const questionStr = document.getElementById('question').innerText;
            
            feedback.innerHTML = `⏰ 時間到！正確答案是 ${correctAnswer}`;
            feedback.className = "h-6 font-bold text-sm mb-2 text-red-600";

            const recordText = `⏰ ${questionStr.replace('?', '無')} (超時，應為 ${correctAnswer})`;
            saveHistory(recordText);

            setTimeout(generateQuestion, 2000);
        }

        // 切換練習模式
        function setMode(mode) {
            currentMode = mode;
            ['add', 'sub', 'mul'].forEach(m => {
                const btn = document.getElementById(`btn-${m}`);
                if (m === mode) {
                    btn.className = "flex-1 py-2 rounded-xl font-bold text-xs bg-purple-600 text-white shadow transition active:scale-95";
                } else {
                    btn.className = "flex-1 py-2 rounded-xl font-bold text-xs bg-white/70 text-gray-700 shadow transition active:scale-95";
                }
            });
            generateQuestion();
        }

        // 產生出題
        function generateQuestion() {
            clearInterval(timerInterval);
            document.getElementById('userAnswer').value = '';
            document.getElementById('feedback').innerText = '';

            if (currentMode === 'add') {
                num1 = Math.floor(Math.random() * 10) + 1;
                num2 = Math.floor(Math.random() * 10) + 1;
                correctAnswer = num1 + num2;
                document.getElementById('question').innerText = `${num1} + ${num2} = ?`;
            } else if (currentMode === 'sub') {
                num1 = Math.floor(Math.random() * 10) + 1;
                num2 = Math.floor(Math.random() * 10) + 1;
                if (num1 < num2) [num1, num2] = [num2, num1];
                correctAnswer = num1 - num2;
                document.getElementById('question').innerText = `${num1} - ${num2} = ?`;
            } else if (currentMode === 'mul') {
                num1 = Math.floor(Math.random() * 5) + 1;
                num2 = Math.floor(Math.random() * 5) + 1;
                correctAnswer = num1 * num2;
                document.getElementById('question').innerText = `${num1} × ${num2} = ?`;
            }

            renderVisualStars(num1 + num2);
            startTimer();
        }

        // 視覺輔助星星
        function renderVisualStars(count) {
            const container = document.getElementById('visualStars');
            container.innerHTML = '';
            const totalStars = Math.min(count, 15);
            for (let i = 0; i < totalStars; i++) {
                const star = document.createElement('span');
                star.innerText = '⭐';
                star.className = 'text-lg cursor-pointer transition transform hover:scale-125';
                star.onclick = function() {
                    this.style.opacity = this.style.opacity === '0.3' ? '1' : '0.3';
                };
                container.appendChild(star);
            }
        }

        // 檢查答案
        function checkAnswer() {
            const userInputValue = document.getElementById('userAnswer').value;
            if (userInputValue === '') return;

            clearInterval(timerInterval);

            const userAnswer = parseInt(userInputValue);
            const feedback = document.getElementById('feedback');
            const questionStr = document.getElementById('question').innerText;

            let isCorrect = (userAnswer === correctAnswer);
            let recordText = "";

            if (isCorrect) {
                score += 10;
                stars += 1;
                feedback.innerHTML = "🎉 太棒了！答對了！";
                feedback.className = "h-6 font-bold text-sm mb-2 text-green-700 animate-bounce";
                recordText = `✅ ${questionStr.replace('?', userAnswer)} (答對)`;

                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('math_highScore', highScore);
                    document.getElementById('highScore').innerText = highScore + ' 分';
                }
            } else {
                feedback.innerHTML = `💪 答案是 ${correctAnswer}`;
                feedback.className = "h-6 font-bold text-sm mb-2 text-orange-600";
                recordText = `❌ ${questionStr.replace('?', userAnswer)} (錯，應為 ${correctAnswer})`;
            }

            document.getElementById('currentScore').innerText = score + ' 分';
            document.getElementById('starCount').innerText = '⭐ ' + stars;

            saveHistory(recordText);
            setTimeout(generateQuestion, 1500);
        }

        // 儲存與更新歷史紀錄
        function saveHistory(recordText) {
            historyLogs.unshift(recordText);
            if (historyLogs.length > 15) historyLogs.pop();
            localStorage.setItem('math_history', JSON.stringify(historyLogs));
            updateHistoryUI();
        }

        // 歷史紀錄 UI
        function updateHistoryUI() {
            const list = document.getElementById('historyList');
            if (historyLogs.length === 0) {
                list.innerHTML = `<li class="text-gray-400">尚無紀錄</li>`;
                return;
            }
            list.innerHTML = historyLogs.map(log => `<li class="border-b border-gray-100 py-0.5">${log}</li>`).join('');
        }

        // 開啟/關閉歷史紀錄
        function toggleHistory() {
            const panel = document.getElementById('historyPanel');
            panel.classList.toggle('hidden');
        }

        // 清除資料
        function resetData() {
            if (confirm("確定要清除所有紀錄嗎？")) {
                clearInterval(timerInterval);
                localStorage.clear();
                score = 0;
                stars = 0;
                highScore = 0;
                historyLogs = [];
                document.getElementById('currentScore').innerText = '0 分';
                document.getElementById('starCount').innerText = '⭐ 0';
                document.getElementById('highScore').innerText = '0 分';
                updateHistoryUI();
                generateQuestion();
            }
        }
    </script>
</body>
</html>
